services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: locker
      POSTGRES_PASSWORD: locker
      POSTGRES_DB: locker
    volumes:
      - locker_pg:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U locker -d locker"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "3000:3000"
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://locker:locker@db:5432/locker
      SESSION_SECRET: ${SESSION_SECRET:-replace-with-at-least-32-character-secret}
      TZ: Asia/Hong_Kong
    depends_on:
      db:
        condition: service_healthy

volumes:
  locker_pg:
